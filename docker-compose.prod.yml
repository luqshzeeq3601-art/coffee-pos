services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee-pos-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: coffee_pos_prod
      POSTGRES_USER: coffee_pos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecureProductionPassword123!}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_pos_admin -d coffee_pos_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coffee-pos-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-SuperSecureRedisPassword123!}
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SuperSecureRedisPassword123!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: coffee-pos-api-prod
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=coffee_pos_prod;Username=coffee_pos_admin;Password=${POSTGRES_PASSWORD:-SuperSecureProductionPassword123!};
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:-SuperSecureRedisPassword123!}
      Jwt__Secret: ${JWT_SECRET:-Production_Super_Secret_Key_At_Least_32_Chars_Long!}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata_prod:
  redisdata_prod:
